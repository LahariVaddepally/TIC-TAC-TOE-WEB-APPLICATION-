<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe</title>

<style>
    body {
        font-family: 'Poppins', sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #fdfbfb, #ebedee);
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .game-container {
        background: #ffffff;
        padding: 30px 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    h1 {
        margin-bottom: 10px;
        color: #374151;
    }

    .board {
        display: grid;
        grid-template-columns: repeat(3, 100px);
        gap: 10px;
        justify-content: center;
        margin: 20px auto;
    }

    .cell {
        width: 100px;
        height: 100px;
        font-size: 60px;
        border-radius: 12px;
        border: 2px solid #d1d5db;
        cursor: pointer;
        background-color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s ease;
        user-select: none;
    }

    .cell:hover {
        background-color: #e5e7eb;
        transform: scale(1.05);
    }

    .cell.X {
        color: #ef4444;
    }

    .cell.O {
        color: #3b82f6;
    }

    .cell.win {
        background-color: #dcfce7;
        border-color: #22c55e;
    }

    #status {
        font-size: 18px;
        margin: 15px 0;
        font-weight: 600;
        color: #374151;
    }

    button {
        padding: 10px 25px;
        font-size: 16px;
        border: none;
        border-radius: 25px;
        background: linear-gradient(90deg, #a5b4fc, #7dd3fc);
        color: #1f2937;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    }
</style>
</head>

<body>

<div class="game-container">
    <h1>Tic Tac Toe</h1>

    <div class="board">
        <div class="cell" onclick="play(0)"></div>
        <div class="cell" onclick="play(1)"></div>
        <div class="cell" onclick="play(2)"></div>
        <div class="cell" onclick="play(3)"></div>
        <div class="cell" onclick="play(4)"></div>
        <div class="cell" onclick="play(5)"></div>
        <div class="cell" onclick="play(6)"></div>
        <div class="cell" onclick="play(7)"></div>
        <div class="cell" onclick="play(8)"></div>
    </div>

    <p id="status">Player X's turn</p>
    <button onclick="resetGame()">Restart Game</button>
</div>

<script>
    let board = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let gameActive = true;

    const cells = document.querySelectorAll(".cell");
    const statusText = document.getElementById("status");

    const winConditions = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    function play(index) {
        if (!gameActive || board[index] !== "") return;

        board[index] = currentPlayer;
        cells[index].innerText = currentPlayer;
        cells[index].classList.add(currentPlayer);

        checkWinner();
    }

    function checkWinner() {
        for (let condition of winConditions) {
            let [a, b, c] = condition;
            if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                statusText.innerText = `🎉 Player ${currentPlayer} Wins!`;
                cells[a].classList.add("win");
                cells[b].classList.add("win");
                cells[c].classList.add("win");
                gameActive = false;
                return;
            }
        }

        if (!board.includes("")) {
            statusText.innerText = "😐 Game Draw!";
            gameActive = false;
            return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusText.innerText = `Player ${currentPlayer}'s turn`;
    }

    function resetGame() {
        board = ["", "", "", "", "", "", "", "", ""];
        currentPlayer = "X";
        gameActive = true;
        statusText.innerText = "Player X's turn";
        cells.forEach(cell => {
            cell.innerText = "";
            cell.className = "cell";
        });
    }
</script>

</body>
</html>
